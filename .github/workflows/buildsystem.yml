name: Build Nix System

on: push

jobs:
  nixmake:
    name: Build
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
      - name: Build Morris
        id: nixbuildm
        continue-on-error: true
        run: nixos-rebuild build --flake ./#M04RYS8
      - name: Morris trace
        if: ${{ steps.nixbuildm.outcome == 'failure' }}
        run: nixos-rebuild build --flake ./#M04RYS8 --show-trace
      - name: Build Aola
        id: nixbuilda
        continue-on-error: true
        run: nixos-rebuild build --flake ./#A0LA
      - name: Aola trace
        if: ${{ steps.nixbuilda.outcome == 'failure' }}
        run: nixos-rebuild build --flake ./#A0LA --show-trace
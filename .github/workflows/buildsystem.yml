name: Build Nix System

on: push

jobs:
  nixmake:
    name: Build
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Run nixos-rebuild
        id: nixbuild
        continue-on-error: true
        run: nixos-rebuild build --flake ./#M04RYS8
      - name: Failure trace
        if: ${{ steps.nixbuild.outcome == 'failure' }}
        run: nixos-rebuild build --flake ./#M04RYS8 --show-trace
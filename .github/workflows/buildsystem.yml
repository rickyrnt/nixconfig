name: Build Nix System

on: push

jobs:
  nixmake:
    name: Build
    runs-on: self-hosted
    steps:
      - name: run_nixos-rebuild
        continue-on-error: true
        run: nixos-rebuild build --flake github:rickyrnt/nixconfig#M04RYS8
      - name: failure_trace
        if: ${{ steps.run_nixos-rebuild.outcome == 'failure' }}
        run: nixos-rebuild build --flake github:rickyrnt/nixconfig#M04RYS8 --show-trace